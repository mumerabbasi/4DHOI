[tool.ruff]
line-length = 160

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C408", "C901", "E402", "E501", "E741", "F402", "F823", "I001"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
